# Test automatici: a ogni push e a ogni pull request GitHub installa Labellula su Windows, macOS e Linux
# (con due versioni di Python) ed esegue tutti i test. Il risultato compare come spunta verde o croce rossa.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pillow-heif
      - name: Test
        run: python -m unittest discover -s tests -t . -v
      - name: Sintassi degli script di installazione
        if: runner.os != 'Windows'
        run: sh -n tools/installa.sh && sh -n tools/avvia_labellula.sh
